name: verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pass07a:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Record evidence boundary
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'LCXXVI_CI_STARTED_AT=' + Date.now() + '\n')"
      - run: npm ci
      - name: Synthetic diagnostic summary checks
        run: python3 -m unittest discover -s tests -p test_synthetic_quality_summary.py -v
      - run: npx playwright install --with-deps chromium firefox
      - name: M7K review selection provenance and reproducibility
        run: |
          python3 -m unittest discover -s tests -p "test_m7k_*.py" -v
          python3 scripts/m7k-select-review-cases.py --out "$RUNNER_TEMP/m7k-review.json"
          diff docs/verification-m7k/LC_M7K_REPRESENTATIVE_REVIEW.json "$RUNNER_TEMP/m7k-review.json"
      - run: npm run verify:07a
      - name: M7K isolated research archive acceptance
        run: |
          npx vite build --config vite.m7k.config.ts
          npx playwright test --config playwright.m7k.config.ts --reporter list
      - name: Production browser performance observations
        run: |
          npx vite build --config vite.acceptance.config.ts
          npx playwright test --config playwright.acceptance.config.ts --reporter list
      - name: IndexedDB and managed-binding persistence in Chromium
        run: npx playwright test --config playwright.m4.config.ts --reporter list --output test-results/m4 --trace retain-on-failure
      - name: Exhibition layout regressions in both browsers
        run: npx playwright test --config playwright.ui.config.ts --grep "desktop essential" --reporter list --output test-results/layout --trace retain-on-failure
        env:
          LCXXVI_UI_EVIDENCE_DIR: test-results/layout/images
      - name: Retain structured verification evidence
        if: always()
        run: node scripts/ci-evidence.mjs --kind=linux
        env:
          LCXXVI_UPSTREAM_STATUS: ${{ job.status }}
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: pass07a-verification
          path: |
            docs/verification-pass07a/
            test-results/layout/
            test-results/acceptance-observations/
          if-no-files-found: warn
          retention-days: 7
  # Hosted Windows acceptance, split into three parallel legs (docs/verification-pass07a/WINDOWS_CI_SPLIT_2026-11-26.md):
  # core runs the non-browser checks, the Chromium persistence suite and the EXE build and smoke test once; each browser
  # leg runs every browser suite for its own browser. The job named windows-browser-acceptance below keeps the check
  # name and fails unless every leg passed and together they are the whole run of scripts/owner-acceptance.mjs.
  windows-acceptance:
    name: windows-acceptance (${{ matrix.scope }})
    runs-on: windows-latest
    # Each leg runs part of the old single job: the 140-minute UI suite budget in scripts/owner-acceptance.mjs is kept
    # per browser leg, so the job limit is kept too.
    timeout-minutes: 200
    permissions:
      contents: read
    strategy:
      # Every leg runs to the end, so one leg's failure does not hide another's result.
      fail-fast: false
      matrix:
        scope: [core, chromium, firefox]
    outputs:
      leg-core: ${{ steps.evidence.outputs.leg-core }}
      leg-chromium: ${{ steps.evidence.outputs.leg-chromium }}
      leg-firefox: ${{ steps.evidence.outputs.leg-firefox }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Record Windows runtime and source
        run: |
          node -e "console.log(process.platform, process.version)"
          git rev-parse HEAD
      - name: Record evidence boundary
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'LCXXVI_CI_STARTED_AT=' + Date.now() + '\n')"
      # The launcher scripts parse, and open the browser they find, under both Windows PowerShell 5.1 (used by the
      # .bat launchers) and PowerShell 7.
      - name: Check the Windows launcher scripts (Windows PowerShell 5.1)
        if: matrix.scope == 'core'
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/windows/test-launcher-scripts.ps1
      - name: Check the Windows launcher scripts (PowerShell 7)
        if: matrix.scope == 'core'
        shell: pwsh
        run: pwsh -NoProfile -File tools/windows/test-launcher-scripts.ps1
      - run: npm ci
      - name: Collect hosted Windows build and browser evidence (${{ matrix.scope }})
        run: node scripts/owner-acceptance.mjs --skip-install --scope=${{ matrix.scope }}
      - name: Build and smoke-test the Windows EXE launcher
        if: always() && matrix.scope == 'core'
        timeout-minutes: 10
        shell: pwsh
        run: |
          # Audit 16 Nov 2026, Phase 6: compile the EXE from source, start it, and check its local-only
          # shutdown guard. The runner is an administrator, so the standard-user http.sys path is not covered.
          npm run build
          # Embed the game's icon (drawn in code by scripts/make-icon.mjs) so the packaged EXE matches the shortcuts.
          $icon = Join-Path $env:RUNNER_TEMP 'lord-cricket.ico'
          node --input-type=module -e "import { iconIco } from './scripts/make-icon.mjs'; import { writeFileSync } from 'node:fs'; writeFileSync(process.argv[1], iconIco());" $icon
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/windows/build-exe.ps1 -Icon $icon
          $env:PORT = "4381"
          $exe = Start-Process -FilePath (Join-Path $PWD 'LordCricketXXVI.exe') -PassThru
          $base = $null
          foreach ($i in 1..60) {
            foreach ($candidate in @('http://127.0.0.1:4381', 'http://localhost:4381')) {
              try { $h = Invoke-RestMethod "$candidate/__lcxxvi-health" -TimeoutSec 2; if ($h.app -eq 'lord-cricket-xxvi') { $base = $candidate } } catch {}
            }
            if ($base) { break }
            Start-Sleep -Seconds 1
          }
          if (-not $base) { Stop-Process -Id $exe.Id -Force -ErrorAction SilentlyContinue; throw 'EXE launcher did not report healthy within 60 s' }
          Write-Host "EXE serving at $base"
          $index = Invoke-WebRequest "$base/" -UseBasicParsing
          if ($index.Content -notmatch 'Lord Cricket XXVI') { throw 'EXE did not serve index.html' }
          $bare = try { Invoke-WebRequest "$base/__lcxxvi-shutdown" -Method Post -UseBasicParsing; 200 } catch { [int]$_.Exception.Response.StatusCode }
          if ($bare -ne 403) { throw "Bare shutdown POST returned $bare, expected 403" }
          $foreign = try { Invoke-WebRequest "$base/__lcxxvi-shutdown" -Method Post -Headers @{ 'X-LCXXVI-Shutdown' = '1'; 'Origin' = 'https://example.com' } -UseBasicParsing; 200 } catch { [int]$_.Exception.Response.StatusCode }
          if ($foreign -ne 403) { throw "Foreign-origin shutdown POST returned $foreign, expected 403" }
          Invoke-RestMethod "$base/__lcxxvi-shutdown" -Method Post -Headers @{ 'X-LCXXVI-Shutdown' = '1' } | Out-Null
          if (-not $exe.WaitForExit(15000)) { Stop-Process -Id $exe.Id -Force; throw 'EXE did not exit after an authorised shutdown' }
          Write-Host 'EXE launcher: built, served, refused bare and foreign-origin shutdown, stopped on the launcher request'
          # Package the tested EXE with the built game, for the owner to download and play on Windows.
          $env:LCXXVI_PACKAGE_EXE = (Join-Path $PWD 'LordCricketXXVI.exe')
          node scripts/package-game.mjs windows-package
          if ($LASTEXITCODE -ne 0) { throw 'Packaging the Windows game zip failed' }
      - uses: actions/upload-artifact@v4
        if: matrix.scope == 'core'
        continue-on-error: true
        with:
          name: windows-game
          path: windows-package/lord-cricket-xxvi-windows-*.zip
          if-no-files-found: warn
          retention-days: 30
      - name: Retain structured verification evidence (${{ matrix.scope }})
        id: evidence
        if: always()
        run: node scripts/ci-evidence.mjs --kind=windows --scope=${{ matrix.scope }}
        env:
          LCXXVI_UPSTREAM_STATUS: ${{ job.status }}
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: windows-browser-acceptance-${{ matrix.scope }}
          path: |
            test-results/owner-acceptance-*/
          if-no-files-found: warn
          retention-days: 7
  # Keeps the check name windows-browser-acceptance (docs/BRANCH_PROTECTION.md asks for it as a required check). It
  # fails unless all three legs passed, ran exactly their planned steps from this commit, together covered every step
  # of the full plan, wrote both browsers' observations and passed the same number of tests in each browser.
  windows-browser-acceptance:
    needs: windows-acceptance
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check that every Windows leg passed and together they are the whole acceptance run
        run: node scripts/ci-evidence.mjs --combine
        env:
          LCXXVI_LEGS_RESULT: ${{ needs.windows-acceptance.result }}
          LCXXVI_LEG_OUTPUTS: ${{ toJSON(needs.windows-acceptance.outputs) }}
