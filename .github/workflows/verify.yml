name: verify
on: [push, pull_request]
jobs:
  pass07a:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Synthetic diagnostic summary checks
        run: python3 -m unittest discover -s tests -p test_synthetic_quality_summary.py -v
      - run: npx playwright install --with-deps chromium firefox
      - name: M7K review selection provenance and reproducibility
        run: |
          python3 -m unittest discover -s tests -p "test_m7k_*.py" -v
          python3 scripts/m7k-select-review-cases.py --out "$RUNNER_TEMP/m7k-review.json"
          diff docs/verification-m7k/LC_M7K_REPRESENTATIVE_REVIEW.json "$RUNNER_TEMP/m7k-review.json"
      - run: npm run verify:07a
      - name: M7K isolated research archive acceptance
        run: |
          npx vite build --config vite.m7k.config.ts
          npx playwright test --config playwright.m7k.config.ts --reporter list
      - name: Production browser performance observations
        run: |
          npx vite build --config vite.acceptance.config.ts
          npx playwright test --config playwright.acceptance.config.ts --reporter list
      - name: Exhibition layout regressions in both browsers
        run: npx playwright test --config playwright.ui.config.ts --grep "desktop essential" --reporter list --output test-results/layout --trace retain-on-failure
        env:
          LCXXVI_UI_EVIDENCE_DIR: test-results/layout/images
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pass07a-verification
          path: |
            docs/verification-pass07a/
            test-results/layout/
            test-results/acceptance-observations/
          if-no-files-found: warn
          retention-days: 14
  windows-browser-acceptance:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Record Windows runtime and source
        run: |
          node -e "console.log(process.platform, process.version)"
          git rev-parse HEAD
      - run: npm ci
      - name: Collect hosted Windows build and browser evidence
        run: node scripts/owner-acceptance.mjs --skip-install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-browser-acceptance
          path: |
            test-results/owner-acceptance-*/
          if-no-files-found: warn
          retention-days: 14
