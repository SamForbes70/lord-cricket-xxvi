name: Captain's Pavilion playtest
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/src/match/CloseFinish.tsx"
      - ".github/workflows/captain-playtest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/package-game.mjs "$RUNNER_TEMP/playtest"
      - uses: actions/upload-artifact@v4
        with:
          name: lord-cricket-captains-pavilion
          path: ${{ runner.temp }}/playtest/lord-cricket-xxvi-game-*.zip
          if-no-files-found: error
          retention-days: 30
